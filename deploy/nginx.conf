# AZ Technology — nginx reverse proxy template.
# DOMAIN_PLACEHOLDER / ADMIN_DOMAIN_PLACEHOLDER are substituted with real
# domains (read from deploy/.env.<env>) by deploy.sh via sed before the file
# is copied to the server. Do NOT hardcode a domain here.
#
# web   (Next.js SSR, PM2 az-web)  → proxied from 127.0.0.1:3000
# admin (Strapi,      PM2 az-cms)  → proxied from 127.0.0.1:1337
#
# Both blocks start on :80 only. `certbot --nginx` (deploy/setup-ssl.sh) adds
# the :443 server blocks + HTTP→HTTPS redirect in place, once DNS is live.

# --- web: apex + www (www redirects to apex via Next's own redirect config,
# both are proxied to the same upstream so either host works over plain HTTP
# before SSL is issued) ---
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER www.DOMAIN_PLACEHOLDER;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Quote/contact form payloads — keep generous, no file uploads on this site.
    client_max_body_size 20M;

    # Next.js build-hashed static assets (/_next/static/**) are immutable —
    # safe to cache aggressively at the edge. Still proxied: Next serves these
    # from .next/standalone at runtime, there is no on-disk root for nginx to
    # read directly, so do NOT use try_files here.
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

# --- admin: Strapi CMS ---
server {
    listen 80;
    listen [::]:80;
    server_name ADMIN_DOMAIN_PLACEHOLDER;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Strapi admin media uploads — larger than the web form limit.
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
